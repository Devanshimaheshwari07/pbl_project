{% extends "base.html" %}

{% block title %}Sign Up - ResQmed{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 2rem;">
    <div class="card">
        <h2 class="text-center mb-2">Create Account</h2>

        <form method="POST" action="{{ url_for('signup') }}">
            <div class="mb-1">
                <input type="text" name="name" placeholder="Full Name" required>
            </div>
            <div class="mb-1">
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="mb-1">
                <input type="password" id="page-signup-password" name="password" placeholder="Password (min 8 chars)" required>
                <div id="page-password-strength" style="font-size: 0.85rem; margin-top: 5px;"></div>
            </div>

            <div class="grid" style="gap: 10px; grid-template-columns: 1fr 1fr;">
                <input type="text" name="address" placeholder="Address/City">
                <input type="number" name="age" placeholder="Age" min="0">
            </div>

            <select name="blood_group" class="mb-2">
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <button type="submit" class="button" style="width: 100%;">Create Account</button>
        </form>

        <div class="text-center mt-2">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const pwdInput = document.getElementById('page-signup-password');
        if (pwdInput) {
            pwdInput.addEventListener('input', function(e) {
                // Reuse existing function if available or simple check
                const val = e.target.value;
                const indicator = document.getElementById('page-password-strength');
                if (val.length < 8) {
                    indicator.textContent = "Too short";
                    indicator.style.color = "var(--danger)";
                } else {
                     indicator.textContent = "Length OK";
                     indicator.style.color = "var(--success)";
                }
            });
        }
    });
</script>
{% endblock %}
