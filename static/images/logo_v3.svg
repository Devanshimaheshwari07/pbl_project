<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" /> <!-- Sky Blue -->
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" /> <!-- Royal Blue -->
    </linearGradient>
  </defs>
  
  <!-- Stylized Shield Outline -->
  <path d="M50 8 C20 8 10 30 10 50 C10 75 50 95 50 95 C50 95 90 75 90 50 C90 30 80 8 50 8 Z" 
        fill="none" stroke="url(#grad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- EKG Heartbeat Pulse -->
  <path d="M25 50 L38 50 L45 30 L55 70 L62 50 L75 50" 
        fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" from="0,100" to="100,0" dur="2s" fill="freeze" />
  </path>
  
  <!-- Dot at the end of pulse -->
  <circle cx="75" cy="50" r="3" fill="#dc2626">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
